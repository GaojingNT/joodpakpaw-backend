        get properties with optional filtering modes:
        - Top Rated: ?minRating=4.0 (filter by avg rating, sorted DESC)
        - Best Value: ?sortBy=price (filter by below-average price, sorted ASC)
        - New Listings: ?days=30 (published within N days, sorted by newest; fallback to 20 most recent if < 5 results)
        - Trending: ?sortBy=trending (most booked properties, sorted by bookingCount DESC)
      parameters:
      - description: page number
        in: query
        name: page
        type: string
      - description: page size
        in: query
        name: limit
        type: string
      - description: search query
        in: query
        name: search
        type: string
      - description: field to search by
        in: query
        name: searchBy
        type: string
      - description: 'Top Rated: minimum avg rating filter (e.g. 4.0)'
        in: query
        name: minRating
        type: number
      - description: 'Sort mode: ''price'' (Best Value) or ''trending'' (Most Booked)'
        in: query
        name: sortBy
        type: string
      - description: 'New Listings: published within last N days (e.g. 30)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paginator.Pagination'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exception.ErrorResponse'
      summary: List properties
      tags:
      - Property Module (Version 1)
    post:
